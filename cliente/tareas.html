<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Tareas - Grupo 1</title>
    <link rel="stylesheet" href="src/styles/main.css">
</head>

<body>
    <div class="container">
        <nav class="navbar" id="mainNav">
            <ul class="navbar__menu" id="navMenu">
                <li><a href="#/tareas" class="navbar__link">Lista de Tareas</a></li>
                <li><a href="#/busqueda-de-usuarios" class="navbar__link">Búsqueda de Usuario</a></li>
                <li><a href="#/registrar-tareas" class="navbar__link">Registro de Tareas</a></li>
                <li><a href="#/categorias" class="navbar__link">Categorías</a></li>
            </ul>
        </nav>

        <header class="header">
            <h1 class="header__title">Sistema de Gestión de Tareas</h1>
            <p class="header__subtitle">Búsqueda de usuarios y asignación de tareas</p>
        </header>

        <main id="root" class="main-content-spa"></main>

        <dialog id="editTaskModal">
            <form id="editTaskForm">
                <h3>Editar tarea</h3>
                <label for="editTaskTitle">Título</label>
                <input type="text" id="editTaskTitle" />
                <label for="editTaskDescription">Descripción</label>
                <textarea id="editTaskDescription" rows="4"></textarea>
                <div>
                    <button type="button" id="cancelEditTaskBtn">Cancelar</button>
                    <button type="submit">Guardar</button>
                </div>
            </form>
        </dialog>

        <dialog id="deleteTaskModal" class="modal">
            <form id="deleteTaskForm" class="modal__content">
                <h3>Eliminar tarea</h3>
                <p id="deleteTaskMessage">¿Estás seguro de que deseas eliminar esta tarea?</p>
                <div>
                    <button type="button" id="cancelDeleteTaskBtn">Cancelar</button>
                    <button type="submit" id="confirmDeleteTaskBtn">Eliminar</button>
                </div>
            </form>
        </dialog>

        <div id="toastContainer" class="toast-container"></div>

        <footer class="footer">
            <p class="footer__text">Ejercicio de manipulación del DOM | SENA - Desarrollo Web</p>
        </footer>
    </div>

    <script src="./src/js/app.js" type="module"></script>
</body>

</html>
